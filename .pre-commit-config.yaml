# Pre-commit hooks.
#
# These run automatically on `git commit` and block it when a check fails, so
# the rules are enforced at the point of writing rather than remembered by a
# reviewer.
#
# Every one of these also runs in CI. That duplication is on purpose: a local
# hook can be skipped with `git commit --no-verify`, so the hook is there to
# give fast feedback, and CI is there to make the rule actually binding. If a
# check only existed here it would be advisory.
#
# Install once per clone:
#   pre-commit install
#
# Run against everything, not just staged files:
#   pre-commit run --all-files

repos:
  # Cyclomatic complexity is enforced here, through rule C901. The ceiling is
  # set to 16 in pyproject.toml rather than passed as a flag, so the local hook,
  # CI and a developer running ruff by hand all read the same number.
  # Pinned to the same ruff version as requirements.txt. If the hook ran a
  # different version from CI, a commit could pass locally and fail on the
  # pipeline, or worse, pass the pipeline having been checked by weaker rules.
  # Bump both together, never one alone.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        name: lint and complexity check
        args: [--no-fix]

  # A committed credential is compromised the moment it is pushed, and removing
  # it later does not undo that. Scanning before the commit exists is the only
  # point at which it is still cheap to fix.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  # Type checking and tests run from the project virtualenv rather than an
  # isolated environment pre-commit builds, because both need the project's own
  # dependencies and its pyproject configuration.
  - repo: local
    hooks:
      - id: mypy
        name: type check
        entry: .venv/bin/mypy
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: tests and coverage
        entry: .venv/bin/pytest --cov --cov-fail-under=85 -m "not slow"
        language: system
        types: [python]
        pass_filenames: false
