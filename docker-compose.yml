# Compose stack: gateway, redis, chromadb, jaeger.
#
# Will define four services:
#
#   gateway   built from the Dockerfile, the only service with a published
#             port, configured entirely by environment variables
#   redis     Tier 1 cache and the rate limiter buckets, started with
#             appendonly yes, mounting a named volume
#   chromadb  Tier 2 vector index, mounting a named volume
#   jaeger    all-in-one trace collector and UI; gateway ships spans to its
#             OTLP/HTTP endpoint on port 4318 and the UI is on 16686
#
# Both stateful services use named volumes because state must survive a
# container restart. Without that, a benchmark run started right after a restart
# begins cold and reports a hit ratio that says nothing about the cache and
# everything about the restart.
#
# Redis runs with append only persistence rather than periodic snapshots, since
# losing the last few seconds of writes to an untimely crash would quietly
# change the numbers between runs.
#
# Only the gateway port is published. Redis and Chroma stay reachable on the
# internal network only.

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    # .env is optional: without one the gateway runs with the stub provider.
    env_file:
      - path: .env
        required: false
    environment:
      # Enable tracing and point it at Jaeger's OTLP/HTTP ingest. These
      # override whatever is in .env so the Compose stack always traces.
      SEMCACHE_TRACING_ENABLED: "true"
      SEMCACHE_OTEL_EXPORTER_ENDPOINT: "http://jaeger:4318"
      # Inside the stack the stores are reached by service name, not localhost,
      # and Chroma listens on its own port 8000 on the internal network.
      SEMCACHE_REDIS_URL: "redis://redis:6379/0"
      SEMCACHE_CHROMA_HOST: "http://chromadb:8000"
      SEMCACHE_SEMANTIC_CACHE_ENABLED: "true"
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  chromadb:
    # Pinned to the same version as the chromadb client in requirements.txt,
    # because client and server must agree on the v2 API.
    image: chromadb/chroma:1.5.9
    volumes:
      # Chroma 1.x persists to /data (persist_path in the image's config.yaml).
      - chroma_data:/data
    healthcheck:
      # The image ships neither curl nor wget, so bash's /dev/tcp asks the
      # v2 heartbeat directly.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /api/v2/heartbeat HTTP/1.0\r\n\r\n' >&3 && grep -q nanosecond <&3
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4318:4318"     # OTLP/HTTP ingest (used by gateway)
    healthcheck:
      # The admin endpoint answers {"status":"Server available",...}; it never
      # contains "ok", so the check looks for the word it does send.
      test: ["CMD-SHELL", "wget -qO- http://localhost:14269/ | grep -q 'Server available'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  redis_data:
  chroma_data:
