# Continuous integration.
#
# Runs on every push and pull request:
#   lint          ruff over the whole tree
#   type check    mypy over app
#   tests         pytest, which needs no services thanks to the fakes
#   secret scan   so a provider key can never reach the history unnoticed
#
# Lint, tests and the secret scan gate every merge into main.
#
# The smoke test means this pipeline is green from the first commit, so a red
# build always means a real regression rather than an unfinished scaffold.
#
# Every action is pinned to a commit SHA rather than a tag. A tag can be moved
# under us, which is the same reproducibility argument that pins the Python
# dependencies, applied to the pipeline itself.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type check and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      # The lockfile, not requirements.txt. Direct pins alone do not make a run
      # reproducible, and reproducibility is what the benchmark numbers rest on.
      - name: Install pinned dependencies
        run: uv pip sync --system requirements.lock.txt

      # Includes the cyclomatic complexity ceiling, rule C901, capped at 16 in
      # pyproject.toml. Enforced here as well as in the pre-commit hook, because
      # a local hook can be skipped with --no-verify and a rule that can be
      # skipped is advice rather than a gate.
      - name: Lint and complexity check
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Test with coverage
        run: pytest --cov --cov-fail-under=85

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      # Full history. Scanning only the tip would miss a key committed earlier
      # and later removed, which is exactly the case that matters.
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      # The gitleaks binary from a pinned release, not gitleaks-action. That
      # action requires a paid licence for repositories owned by a GitHub
      # organisation, which this one is. The scanner itself is MIT licensed and
      # free; the action was only ever saving us three lines of YAML. Pinned to
      # an exact version for the same reason the actions are pinned by SHA.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Scans history, not the working tree. A key that was committed and later
      # removed is still in the history and still compromised, and that is the
      # case worth catching.
      - name: Scan for committed secrets
        run: gitleaks git . --no-banner --redact --exit-code 1
