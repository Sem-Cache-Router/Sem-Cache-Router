# Render Blueprint: the gateway and its showcase page on Render's free tier.
#
# Two services, both free:
#   sem-cache-router      the gateway, built from the Dockerfile, serving the
#                         showcase page at / and the API beside it
#   sem-cache-router-kv   Render Key Value (Redis compatible) for Tier 1,
#                         reachable only from inside Render
#
# What the free tier changes, and why each setting is what it is:
#   - there is no free service to run a Chroma server on, so Chroma runs inside
#     the gateway, in memory (SEMCACHE_CHROMA_EMBEDDED). Measured locally, the
#     gateway with the embedding model and 200 cached entries peaks at 290 MB,
#     inside the free instance's 512 MB
#   - free Key Value keeps no data on disk, and a free web service sleeps after
#     15 minutes without traffic, so the cache starts empty after a restart or
#     a wake up; the first request after sleeping takes about a minute
#   - the provider is the stub, so the deployment needs no provider key and
#     costs nothing; its answers say they come from the stub
#   - the admin key is generated by Render and shown in its dashboard
#   - the rate limiter is on with a small, shared budget, so the page can show it
#   - a deploy waits for CI to pass on main
services:
  - type: web
    name: sem-cache-router
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: SEMCACHE_REDIS_URL
        fromService:
          type: keyvalue
          name: sem-cache-router-kv
          property: connectionString
      - key: SEMCACHE_PRIMARY_PROVIDER
        value: stub
      # Off for now. On the free instance's 0.1 CPU the embedding model took
      # about 290 s to load and 75 to 90 s per new question in a local
      # simulation, because it starts a thread per host core. It goes back on
      # once the embedder is limited to one thread; exact hits work either way.
      - key: SEMCACHE_SEMANTIC_CACHE_ENABLED
        value: "false"
      - key: SEMCACHE_CHROMA_EMBEDDED
        value: "true"
      # The rate limiter, with a small budget so the page's "Send a burst"
      # button shows it: one question reserves about 266 tokens, so a single
      # question always fits, while a burst of new ones runs out and gets 429s
      # that clear within seconds as the budget refills. Every visitor shares
      # the page's one key, and so this one budget.
      - key: SEMCACHE_LIMITER_ENABLED
        value: "true"
      - key: SEMCACHE_BUCKET_CAPACITY
        value: "1000"
      - key: SEMCACHE_BUCKET_REFILL_RATE
        value: "50"
      - key: SEMCACHE_ADMIN_API_KEY
        generateValue: true

  - type: keyvalue
    name: sem-cache-router-kv
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
